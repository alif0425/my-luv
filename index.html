<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7fa">
<title>For You</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #4d3440;
    background: linear-gradient(145deg, #fffafd, #fff0f5);
  }
  .card {
    position: relative; z-index: 2; width: min(100%, 460px);
    padding: 42px 28px; text-align: center;
    background: rgba(255,255,255,.88);
    border: 1px solid #f5dce6; border-radius: 26px;
    box-shadow: 0 16px 50px rgba(120,65,90,.09);
  }
  .small { color: #a77a8e; font-size: .72rem; letter-spacing: 3px; text-transform: uppercase; }
  h1 { margin: 18px 0 14px; font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 600; color: #a84f75; }
  p { font-size: 1rem; line-height: 1.8; color: #755d68; }
  button {
    margin-top: 18px; padding: 14px 28px; border: 0; border-radius: 999px;
    background: #b85c82; color: white; font-size: .95rem; cursor: pointer;
    transition: transform .2s, background .2s;
  }
  button:hover { background: #9f486d; transform: translateY(-2px); }
  button:active { transform: scale(.97); }
  .sign { margin-top: 30px; color: #a77a8e; font-size: .88rem; }
  .heart {
    position: fixed; z-index: 1; bottom: -40px; pointer-events: none;
    color: #e88bad; animation: floatUp linear forwards;
    text-shadow: 0 3px 12px rgba(210,100,145,.18);
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg) scale(.7); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translateY(-115vh) rotate(35deg) scale(1.25); opacity: 0; }
  }
  .burst {
    position: fixed; z-index: 3; left: 50%; top: 50%; pointer-events: none;
    font-size: 22px; animation: burst 1.5s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.3) rotate(var(--r)); opacity: 0; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="small">A little message for you</div>
    <h1>I love you so much.</h1>
    <p>I may not say it every moment, but I hope you know how much you mean to me. I'm really glad to have you in my life.</p>
    <button id="loveButton" type="button">Tap here</button>
    <div class="sign">Made just for you.</div>
  </main>

<script>
  const button = document.getElementById('loveButton');
  let clicked = false;
  const symbols = ['♡', '♥', '💕', '💗'];

  function makeFloatingHeart() {
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (16 + Math.random() * 26) + 'px';
    heart.style.animationDuration = (3.5 + Math.random() * 3) + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }

  button.addEventListener('click', () => {
    for (let i = 0; i < 85; i++) {
      setTimeout(makeFloatingHeart, i * 18);
    }
    for (let i = 0; i < 32; i++) {
      const heart = document.createElement('span');
      heart.className = 'burst';
      heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      const angle = Math.random() * Math.PI * 2;
      const distance = 90 + Math.random() * 230;
      heart.style.setProperty('--x', Math.cos(angle) * distance + 'px');
      heart.style.setProperty('--y', Math.sin(angle) * distance + 'px');
      heart.style.setProperty('--r', (Math.random() * 90 - 45) + 'deg');
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1600);
    }
    button.textContent = 'I love you ❤️';
  });
</script>
</body>
</html>
